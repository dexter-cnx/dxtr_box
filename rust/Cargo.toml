[package]
name = "rust_lib_dxtr_box"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rust_lib_dxtr_box"
crate-type = ["cdylib", "staticlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[features]
default = ["encryption"]
encryption = ["dep:argon2", "dep:chacha20poly1305", "dep:rand_core"]

[dependencies]
redb = "=2.1.0"
flutter_rust_bridge = "=2.8.0"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
once_cell = "1.20"
parking_lot = "0.12"
thiserror = "2"
argon2 = { version = "0.5", optional = true }
chacha20poly1305 = { version = "0.10", optional = true, features = ["std"] }
rand_core = { version = "0.6", optional = true, features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
