[package]
name = "rust_lib_dxtr_box"
version = "1.1.0"
edition = "2021"
description = "Rust-native frontend and shared storage engine for dxtr_box, backed by redb."
license-file = "../LICENSE"
repository = "https://github.com/dexter-cnx/dxtr_box"
readme = "README.md"
keywords = ["database", "embedded", "key-value", "flutter", "rust"]
categories = ["database-implementations", "data-structures"]

[lib]
name = "rust_lib_dxtr_box"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "dxtr-box-inspect"
path = "src/bin/dxtr_box_inspect.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[features]
default = ["full"]
# Core CRUD, lifecycle, and watch delivery are always compiled because the
# public Dart Box lifecycle depends on native watch registration.
encryption = ["dep:argon2", "dep:chacha20poly1305", "dep:rand_core"]
maintenance = []
full = ["encryption", "maintenance", "dep:rmpv", "dep:blake2", "dep:serde_json"]

[dependencies]
redb = "=2.1.0"
flutter_rust_bridge = "=2.8.0"
rmp-serde = "1.3"
rmpv = { version = "1.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
once_cell = "1.20"
parking_lot = "0.12"
thiserror = "2"
argon2 = { version = "0.5", optional = true }
chacha20poly1305 = { version = "0.10", optional = true, features = ["std"] }
rand_core = { version = "0.6", optional = true, features = ["getrandom"] }
# Reuse the BLAKE2 implementation already pulled in by Argon2 for full-profile
# encrypted equality tokens instead of adding a second hash implementation.
blake2 = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"
