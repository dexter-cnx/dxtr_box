name: dxtr_box
description: A fast, ACID, encrypted, Rust-powered NoSQL box DB for Flutter. No codegen.
version: 0.1.0
homepage: https://github.com/dexter-cnx/dxtr_box
repository: https://github.com/dexter-cnx/dxtr_box
issue_tracker: https://github.com/dexter-cnx/dxtr_box/issues

publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.8.0
  hive_ce: ^2.19.3
  msgpack_dart: ^1.0.1
  path: ^1.9.0
  path_provider: ^2.1.5
  rust_lib_dxtr_box:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter
