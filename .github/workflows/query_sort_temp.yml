name: Temporary Query Sort Finalize

on:
  push:
    branches:
      - feature/0.3-query-sort

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/0.3-query-sort
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Apply query sort implementation
        run: |
          python3 tool/apply_query_sort.py
          python3 tool/fix_query_sort_test.py
      - name: Format Dart and Rust
        run: |
          dart format lib/src/query.dart lib/src/box.dart test/query_test.dart
          cargo fmt --manifest-path rust/Cargo.toml
      - name: Validate Dart contract
        run: |
          flutter pub get
          flutter analyze
          flutter test test/query_test.dart
      - name: Validate Rust profiles
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features
          cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features --features encryption
          cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Validate sort integration target
        run: make query-sort-test
      - name: Remove temporary tooling
        run: rm tool/apply_query_sort.py tool/fix_query_sort_test.py .github/workflows/query_sort_temp.yml
      - name: Commit finalized query sort
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add deterministic native query sorting'
          git push origin HEAD:feature/0.3-query-sort
