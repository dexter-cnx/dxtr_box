name: Temporary Index Query Planner Finalize

on:
  push:
    branches:
      - feature/0.3-index-query-planner

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/0.3-index-query-planner
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply planner patch
        run: python3 tool/apply_index_query_planner.py

      - name: Format Rust
        run: cargo fmt --manifest-path rust/Cargo.toml

      - name: Validate Rust profiles
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features
          cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features --features encryption
          cargo test --manifest-path rust/Cargo.toml --all-targets

      - name: Remove temporary tooling
        run: git rm .github/workflows/index_query_planner_temp.yml tool/apply_index_query_planner.py

      - name: Commit finalized planner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/src/query.rs rust/src/index.rs rust/src/api.rs rust/tests/query_index.rs
          if git diff --cached --quiet; then
            echo "No planner changes to commit"
            exit 1
          fi
          git commit -m "feat: add persisted index query planner"
          git push origin HEAD:feature/0.3-index-query-planner
