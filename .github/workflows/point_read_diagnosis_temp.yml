name: Temporary Point Read Diagnosis

on:
  push:
    branches:
      - feature/0.3-point-read-diagnosis

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Format check
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed test/point_read_diagnosis_test.dart
      - name: Run point-read diagnosis
        run: |
          set -o pipefail
          make diagnose-point-read 2>&1 | tee /tmp/point-read-diagnosis.log
          grep '^DXTR_BOX_POINT_READ_DIAGNOSIS ' /tmp/point-read-diagnosis.log | sed 's/^DXTR_BOX_POINT_READ_DIAGNOSIS //' > /tmp/point-read-diagnosis.jsonl
          test -s /tmp/point-read-diagnosis.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: point-read-diagnosis
          path: /tmp/point-read-diagnosis.jsonl
          if-no-files-found: error
