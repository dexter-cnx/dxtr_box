name: Sync Get Experiment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sync_get_experiment.yml'
      - 'test/flutter_sync_get_experiment_test.dart'
      - 'lib/**'
      - 'rust/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

concurrency:
  group: sync-get-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Flutter sync get experiment / Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Install dependencies
        run: flutter pub get
      - name: Build native library
        run: cargo build --manifest-path rust/Cargo.toml --release
      - name: Run sync get experiment
        env:
          DXTR_BOX_SYNC_GET_EXPERIMENT: '1'
          DXTR_BOX_SYNC_GET_ITERATIONS: '5000'
          DXTR_BOX_SYNC_GET_SAMPLES: '7'
        run: |
          LD_LIBRARY_PATH="rust/target/release:${LD_LIBRARY_PATH:-}" \
          PATH="rust/target/release:$PATH" \
          flutter test test/flutter_sync_get_experiment_test.dart --reporter expanded
