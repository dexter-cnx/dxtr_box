name: FRB Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/frb_sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust

      - run: flutter pub get

      - name: Install FRB codegen 2.8.0
        run: cargo install flutter_rust_bridge_codegen --version 2.8.0 --locked

      - name: Generate native integration
        run: bash tool/scaffold_platforms.sh

      - name: Commit generated integration branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C feature/frb-native-integration
          git add analysis_options.yaml pubspec.yaml pubspec.lock \
            rust/src/lib.rs rust/src/frb_generated.rs rust/.gitignore \
            lib/src/rust rust_builder \
            android ios macos linux windows
          git status --short
          git commit -m "feat: add generated FRB native integration"
          git push --force-with-lease origin feature/frb-native-integration
