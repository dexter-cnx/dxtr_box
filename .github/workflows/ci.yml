name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FRB_CODEGEN_VERSION: '2.8.0'

jobs:
  change-detection:
    name: Change Detection
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      dart_core: ${{ steps.filter.outputs.dart_core }}
      rust_core: ${{ steps.filter.outputs.rust_core }}
      encryption: ${{ steps.filter.outputs.encryption }}
      ffi: ${{ steps.filter.outputs.ffi }}
      durable_storage: ${{ steps.filter.outputs.durable_storage }}
      packaging: ${{ steps.filter.outputs.packaging }}
      platform: ${{ steps.filter.outputs.platform }}
      native_size: ${{ steps.filter.outputs.native_size }}
      benchmark: ${{ steps.filter.outputs.benchmark }}
      ci: ${{ steps.filter.outputs.ci }}
      public_api: ${{ steps.filter.outputs.public_api }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      macos: ${{ steps.filter.outputs.macos }}
      linux: ${{ steps.filter.outputs.linux }}
      windows: ${{ steps.filter.outputs.windows }}
      full_validation: ${{ steps.mode.outputs.full_validation }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'README.md'
              - '**/*.md'
            dart_core:
              - 'lib/**'
              - 'test/**'
              - 'example/**'
            rust_core:
              - 'rust/src/**'
              - 'rust/Cargo.toml'
              - 'rust/Cargo.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
            encryption:
              - 'rust/src/**encrypt**'
              - 'rust/src/**crypto**'
              - 'rust/src/**migration**'
              - 'rust/Cargo.toml'
              - 'rust/Cargo.lock'
              - 'test/**encrypt**'
              - 'test/**migration**'
            ffi:
              - 'rust/src/api.rs'
              - 'rust/src/frb_generated.rs'
              - 'lib/src/native_api.dart'
              - 'lib/src/rust/**'
              - 'flutter_rust_bridge.yaml'
              - 'tool/scaffold_platforms.sh'
            durable_storage:
              - 'rust/src/db.rs'
              - 'rust/src/**migration**'
              - 'rust/src/**query**'
              - 'rust/src/**index**'
              - 'lib/src/hive_ce_migration.dart'
              - 'lib/src/query.dart'
              - 'test/migration_destination_test.dart'
              - 'test/query_test.dart'
              - 'test/native_integration_test.dart'
              - 'tool/hive_ce_migration_fixture/**'
              - 'tool/verify_public_storage_contract.dart'
            packaging:
              - 'pubspec.yaml'
              - '.pubignore'
              - 'cargokit/**'
              - 'cargokit_options.yaml'
              - 'tool/validate_published_consumer.dart'
              - 'android/**'
              - 'ios/**'
              - 'macos/**'
              - 'linux/**'
              - 'windows/**'
            platform:
              - 'android/**'
              - 'ios/**'
              - 'macos/**'
              - 'linux/**'
              - 'windows/**'
              - 'cargokit/**'
              - 'cargokit_options.yaml'
            native_size:
              - 'rust/src/**'
              - 'rust/Cargo.toml'
              - 'rust/Cargo.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'cargokit/**'
              - 'android/**'
              - 'ios/**'
              - 'macos/**'
              - 'linux/**'
              - 'windows/**'
              - 'tool/native_size_*.sh'
            benchmark:
              - 'benchmark/**'
              - 'test/point_read_diagnosis_test.dart'
              - 'lib/src/box.dart'
              - 'lib/src/native_api.dart'
              - 'rust/src/api.rs'
              - 'rust/src/db.rs'
            ci:
              - '.github/workflows/**'
              - 'Makefile'
              - 'tool/**'
            public_api:
              - 'lib/dxtr_box.dart'
              - 'lib/src/box.dart'
              - 'lib/src/box_event.dart'
              - 'lib/src/dxtr_box.dart'
              - 'lib/src/hive_ce_migration.dart'
              - 'lib/src/query.dart'
              - 'test/public_api_contract_test.dart'
              - 'tool/verify_public_storage_contract.dart'
            android:
              - 'android/**'
            ios:
              - 'ios/**'
            macos:
              - 'macos/**'
            linux:
              - 'linux/**'
            windows:
              - 'windows/**'
      - name: Resolve validation mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || "${{ github.event.pull_request.draft }}" == "false" ]]; then
            echo 'full_validation=true' >> "$GITHUB_OUTPUT"
          else
            echo 'full_validation=false' >> "$GITHUB_OUTPUT"
          fi

  fast-ci:
    name: Fast CI
    needs: change-detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true
          cache-workspaces: rust
      - name: Fast mandatory gate
        run: make ci-fast

  minimum-sdk:
    name: Minimum SDK / Flutter 3.22.0 + Dart 3.4.0
    needs: [change-detection, fast-ci]
    if: ${{ needs.change-detection.outputs.full_validation == 'true' || needs.change-detection.outputs.dart_core == 'true' || needs.change-detection.outputs.public_api == 'true' || needs.change-detection.outputs.packaging == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

  dart-tests:
    name: Dart / full tests
    needs: [change-detection, fast-ci]
    if: ${{ needs.change-detection.outputs.full_validation == 'true' || needs.change-detection.outputs.dart_core == 'true' || needs.change-detection.outputs.ffi == 'true' || needs.change-detection.outputs.durable_storage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --reporter expanded

  rust-profiles:
    name: Rust / three profiles
    needs: [change-detection, fast-ci]
    if: ${{ needs.change-detection.outputs.full_validation == 'true' || needs.change-detection.outputs.rust_core == 'true' || needs.change-detection.outputs.encryption == 'true' || needs.change-detection.outputs.ffi == 'true' || needs.change-detection.outputs.durable_storage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Test exactly minimal, encryption, and full
        run: make rust-test-profiles

  rust-cross-platform:
    name: Rust platform / ${{ matrix.os }}
    needs: [change-detection, fast-ci, rust-profiles]
    if: ${{ always() && needs.fast-ci.result == 'success' && (needs.change-detection.outputs.full_validation == 'true' || needs.change-detection.outputs.rust_core == 'true' || needs.change-detection.outputs.encryption == 'true' || needs.change-detection.outputs.ffi == 'true' || needs.change-detection.outputs.durable_storage == 'true' || needs.change-detection.outputs.platform == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Compile minimal profile
        run: cargo check --manifest-path rust/Cargo.toml --all-targets --no-default-features
      - name: Compile encryption profile
        run: cargo check --manifest-path rust/Cargo.toml --all-targets --no-default-features --features encryption
      - name: Compile full profile
        run: cargo check --manifest-path rust/Cargo.toml --all-targets

  native-integration:
    name: Native / integration
    needs: [change-detection, fast-ci]
    if: ${{ needs.change-detection.outputs.full_validation == 'true' || needs.change-detection.outputs.rust_core == 'true' || needs.change-detection.outputs.encryption == 'true' || needs.change-detection.outputs.ffi == 'true' || needs.change-detection.outputs.durable_storage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - run: make native-test

  storage-migration:
    name: Storage / migration + query regression
    needs: [change-detection, fast-ci]
    if: ${{ needs.change-detection.outputs.full_validation == 'true' || needs.change-detection.outputs.durable_storage == 'true' || needs.change-detection.outputs.encryption == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - run: make contract-check
      - run: make hive-ce-migration-test
      - run: make query-index-test
      - run: make query-sort-test
      - run: make process-crash

  frb-bindings:
    name: FRB / generated bindings current
    needs: [change-detection, fast-ci]
    if: ${{ needs.change-detection.outputs.full_validation == 'true' || needs.change-detection.outputs.ffi == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - run: flutter pub get
      - name: Cache FRB codegen binary
        id: frb-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-${{ runner.os }}-${{ env.FRB_CODEGEN_VERSION }}
      - name: Install pinned FRB codegen
        if: steps.frb-cache.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version "${FRB_CODEGEN_VERSION}" --locked
      - run: flutter_rust_bridge_codegen generate
      - run: git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs

  package-readiness:
    name: Package / docs + pub dry-run
    needs: [change-detection, fast-ci]
    if: ${{ needs.change-detection.outputs.full_validation == 'true' || needs.change-detection.outputs.packaging == 'true' || needs.change-detection.outputs.public_api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify self-contained native plugin layout
        shell: bash
        run: |
          test ! -d rust_builder
          test -f rust/Cargo.toml
          test -d cargokit
          test -f android/build.gradle
          test -f ios/dxtr_box.podspec
          test -f macos/dxtr_box.podspec
          test -f linux/CMakeLists.txt
          test -f windows/CMakeLists.txt
          if grep -q '^    path:' pubspec.yaml; then
            echo 'publishable dependencies must not use path sources' >&2
            exit 1
          fi
      - run: make package-readiness

  native-size:
    name: Native size / Linux x64 policy
    needs: [change-detection, fast-ci]
    if: ${{ needs.change-detection.outputs.full_validation == 'true' || needs.change-detection.outputs.native_size == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - run: make native-size-baseline
      - env:
          SIZE_STABILITY_RUNS: '3'
        run: make native-size-stability
      - env:
          SIZE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          SIZE_MAX_GROWTH_BYTES: '65536'
          SIZE_MAX_GROWTH_PERCENT: '3'
        run: make native-size-regression
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-size-linux-x64
          path: |
            build/native-size/native-size-baseline.tsv
            build/native-size-stability/native-size-stability.tsv
            build/native-size-regression/native-size-regression.tsv
          if-no-files-found: warn
          retention-days: 14

  platform-builds:
    name: Platform consumer / ${{ matrix.platform }}
    needs: [change-detection, fast-ci]
    if: ${{ needs.change-detection.outputs.full_validation == 'true' || needs.change-detection.outputs.packaging == 'true' || needs.change-detection.outputs.rust_core == 'true' || needs.change-detection.outputs.ffi == 'true' || needs.change-detection.outputs.platform == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Stage payload and build consumer
        run: dart run tool/validate_published_consumer.dart --platform=${{ matrix.platform }}

  benchmark-diagnostics:
    name: Benchmark / correctness + diagnostic smoke
    needs: [change-detection, fast-ci]
    if: ${{ needs.change-detection.outputs.full_validation == 'true' || needs.change-detection.outputs.benchmark == 'true' || needs.change-detection.outputs.durable_storage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - run: make benchmark-smoke
      - run: make benchmark-comparison-correctness
      - name: Diagnostic comparison timing
        run: make benchmark-comparison
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-database-comparison
          path: benchmark/build/comparison/local-database-comparison.jsonl
          if-no-files-found: warn
          retention-days: 14

  merge-gate:
    name: Merge Gate / full quality bar
    if: always()
    needs:
      - change-detection
      - fast-ci
      - minimum-sdk
      - dart-tests
      - rust-profiles
      - rust-cross-platform
      - native-integration
      - storage-migration
      - frb-bindings
      - package-readiness
      - native-size
      - platform-builds
      - benchmark-diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Verify required validation results
        env:
          FULL: ${{ needs.change-detection.outputs.full_validation }}
          CHANGE_DETECTION: ${{ needs.change-detection.result }}
          FAST_CI: ${{ needs.fast-ci.result }}
          MINIMUM_SDK: ${{ needs.minimum-sdk.result }}
          DART_TESTS: ${{ needs.dart-tests.result }}
          RUST_PROFILES: ${{ needs.rust-profiles.result }}
          RUST_CROSS_PLATFORM: ${{ needs.rust-cross-platform.result }}
          NATIVE_INTEGRATION: ${{ needs.native-integration.result }}
          STORAGE_MIGRATION: ${{ needs.storage-migration.result }}
          FRB_BINDINGS: ${{ needs.frb-bindings.result }}
          PACKAGE_READINESS: ${{ needs.package-readiness.result }}
          NATIVE_SIZE: ${{ needs.native-size.result }}
          PLATFORM_BUILDS: ${{ needs.platform-builds.result }}
          BENCHMARK_DIAGNOSTICS: ${{ needs.benchmark-diagnostics.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGE_DETECTION" == success ]]
          [[ "$FAST_CI" == success ]]

          results=(
            "$MINIMUM_SDK" "$DART_TESTS" "$RUST_PROFILES" "$RUST_CROSS_PLATFORM"
            "$NATIVE_INTEGRATION" "$STORAGE_MIGRATION" "$FRB_BINDINGS"
            "$PACKAGE_READINESS" "$NATIVE_SIZE" "$PLATFORM_BUILDS"
            "$BENCHMARK_DIAGNOSTICS"
          )
          for result in "${results[@]}"; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then
              echo "A required/affected validation job ended as $result" >&2
              exit 1
            fi
          done

          if [[ "$FULL" == true ]]; then
            for result in "${results[@]}"; do
              if [[ "$result" != success ]]; then
                echo "Full validation requires success, got: $result" >&2
                exit 1
              fi
            done
          fi
