name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter / analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format lib test example
          git diff --exit-code -- lib test example

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

  native-linux:
    name: Native / Linux FRB round trip
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust

      - name: Install dependencies
        run: flutter pub get

      - name: Build Rust release library
        run: cargo build --manifest-path rust/Cargo.toml --release

      - name: Native round-trip test
        env:
          DXTR_BOX_NATIVE_TEST: '1'
        run: flutter test test/native_integration_test.dart --reporter expanded

      - name: Benchmark smoke harness
        env:
          DXTR_BOX_BENCHMARK: '1'
          DXTR_BOX_BENCHMARK_OPS: '100'
        run: flutter test test/benchmark_smoke_test.dart --reporter expanded

  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true
          cache-workspaces: rust

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Test default features
        run: cargo test --manifest-path rust/Cargo.toml --all-targets

      - name: Test encryption feature compiles and passes
        run: cargo test --manifest-path rust/Cargo.toml --all-targets --features encryption
