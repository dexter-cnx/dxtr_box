name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-sdk:
    name: Minimum SDK / Flutter 3.22.0 + Dart 3.4.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up minimum Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true
      - name: Verify minimum toolchain
        run: flutter --version
      - name: Install dependencies at minimum SDK
        run: flutter pub get
      - name: Analyze at minimum SDK
        run: flutter analyze
      - name: Test at minimum SDK
        run: flutter test --reporter expanded

  flutter:
    name: Flutter / analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: |
          dart format lib test example benchmark/test tool/hive_ce_migration_fixture/test
          git diff --exit-code -- lib test example benchmark/test tool/hive_ce_migration_fixture/test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
      - name: Install benchmark dependencies
        working-directory: benchmark
        run: flutter pub get
      - name: Analyze benchmark package
        working-directory: benchmark
        run: flutter analyze

  frb-bindings:
    name: FRB / generated bindings current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Install dependencies
        run: flutter pub get
      - name: Install flutter_rust_bridge_codegen 2.8.0
        run: cargo install flutter_rust_bridge_codegen --version 2.8.0 --locked
      - name: Regenerate FRB bindings
        run: flutter_rust_bridge_codegen generate
      - name: Upload regenerated bindings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frb-generated-bindings
          path: |
            lib/src/rust
            rust/src/frb_generated.rs
          if-no-files-found: error
          retention-days: 3
      - name: Verify generated bindings are committed
        run: git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs

  native-linux:
    name: Native / Linux FRB round trip
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Install dependencies
        run: flutter pub get
      - name: Build Rust release library
        run: cargo build --manifest-path rust/Cargo.toml --release
      - name: Native round-trip test
        env:
          DXTR_BOX_NATIVE_TEST: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/rust/target/release
        run: flutter test test/native_integration_test.dart --reporter expanded
      - name: Install Hive CE migration fixture dependencies
        working-directory: tool/hive_ce_migration_fixture
        run: flutter pub get
      - name: Analyze Hive CE migration fixture
        working-directory: tool/hive_ce_migration_fixture
        run: flutter analyze
      - name: Real Hive CE 2.19.3 migration fixtures
        working-directory: tool/hive_ce_migration_fixture
        env:
          DXTR_BOX_NATIVE_TEST: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/rust/target/release
        run: flutter test --reporter expanded
      - name: Install benchmark dependencies
        working-directory: benchmark
        run: flutter pub get
      - name: Benchmark smoke harness
        working-directory: benchmark
        env:
          DXTR_BOX_BENCHMARK: '1'
          DXTR_BOX_BENCHMARK_OPS: '100'
          LD_LIBRARY_PATH: ${{ github.workspace }}/rust/target/release
        run: flutter test test/benchmark_smoke_test.dart --reporter expanded

  native-size:
    name: Native size / Linux x64 policy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with comparison history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Measure minimal, encryption, and full profiles
        run: bash tool/native_size_baseline.sh
      - name: Verify same-commit size reproducibility
        env:
          DXTR_BOX_SIZE_RUNS: '3'
        run: bash tool/native_size_stability.sh
      - name: Enforce controlled cross-commit growth budget
        env:
          DXTR_BOX_SIZE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          DXTR_BOX_SIZE_MAX_GROWTH_BYTES: '65536'
          DXTR_BOX_SIZE_MAX_GROWTH_PERCENT: '3'
        run: bash tool/native_size_regression.sh
      - name: Upload native size measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-size-linux-x64
          path: |
            build/native-size/native-size-baseline.tsv
            build/native-size-stability/native-size-stability.tsv
            build/native-size-regression/native-size-regression.tsv
          if-no-files-found: warn
          retention-days: 14

  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true
          cache-workspaces: rust
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Clippy full profile
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Test minimal profile
        run: cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features
      - name: Test encryption profile
        run: cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features --features encryption
      - name: Test full profile
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
