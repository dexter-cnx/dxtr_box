name: Platform Builds

on:
  pull_request:
    branches: [main]
    paths:
      - example/**
      - lib/**
      - rust/**
      - cargokit/**
      - android/**
      - ios/**
      - macos/**
      - linux/**
      - windows/**
      - pubspec.yaml
      - .pubignore
      - tool/validate_published_consumer.dart
      - .github/workflows/platform_builds.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android published consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Stage payload and build Android consumer
        run: dart run tool/validate_published_consumer.dart --platform=android

  linux:
    name: Linux published consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Stage payload and build Linux consumer
        run: dart run tool/validate_published_consumer.dart --platform=linux

  windows:
    name: Windows published consumer
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Stage payload and build Windows consumer
        run: dart run tool/validate_published_consumer.dart --platform=windows

  macos:
    name: macOS published consumer
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Stage payload and build macOS consumer
        run: dart run tool/validate_published_consumer.dart --platform=macos

  ios:
    name: iOS published consumer no-codesign
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Stage payload and build iOS consumer without signing
        run: dart run tool/validate_published_consumer.dart --platform=ios
