name: Platform Builds

on:
  pull_request:
    branches: [main]
    paths:
      - example/**
      - lib/**
      - rust/**
      - rust_builder/**
      - android/**
      - ios/**
      - macos/**
      - linux/**
      - windows/**
      - pubspec.yaml
      - .github/workflows/platform_builds.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Build Android debug APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug

  linux:
    name: Linux example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Build Linux debug app
        working-directory: example
        run: |
          flutter pub get
          flutter config --enable-linux-desktop
          flutter build linux --debug

  windows:
    name: Windows example
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Build Windows debug app
        working-directory: example
        run: |
          flutter pub get
          flutter config --enable-windows-desktop
          flutter build windows --debug --verbose

  macos:
    name: macOS example
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Build macOS debug app
        working-directory: example
        run: |
          flutter pub get
          flutter config --enable-macos-desktop
          flutter build macos --debug

  ios:
    name: iOS example no-codesign
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Build iOS debug app without signing
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign
