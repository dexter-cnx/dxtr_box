name: Registry Consumer Verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Hosted dxtr_box version to verify
        required: true
        default: 1.1.0
        type: string

jobs:
  registry-consumer:
    name: Registry consumer / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: linux
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Verify hosted package consumer
        run: dart run tool/validate_registry_consumer.dart --platform=${{ matrix.platform }} --version=${{ inputs.version }}
      - name: Upload registry evidence
        uses: actions/upload-artifact@v4
        with:
          name: registry-consumer-${{ matrix.platform }}-${{ inputs.version }}
          path: build/registry-evidence/${{ matrix.platform }}.json
          if-no-files-found: error
