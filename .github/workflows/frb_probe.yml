name: FRB Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frb-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate FRB + platform scaffolds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - run: flutter pub get
      - name: Install pinned flutter_rust_bridge_codegen 2.8.0
        run: cargo install flutter_rust_bridge_codegen --version 2.8.0 --locked
      - name: Generate platform scaffolds and FRB bindings
        run: bash tool/scaffold_platforms.sh
      - name: Capture generated diff
        shell: bash
        run: |
          git status --short | tee frb-generated-status.txt
          git add -N .
          git diff --binary > frb-generated.patch
      - uses: actions/upload-artifact@v4
        with:
          name: frb-generated
          if-no-files-found: error
          path: |
            frb-generated-status.txt
            frb-generated.patch
            analysis_options.yaml
            pubspec.yaml
            lib/src/rust
            rust/src/frb_generated.rs
            rust_builder
            android
            ios
            macos
            linux
            windows
            cargokit_options.yaml
