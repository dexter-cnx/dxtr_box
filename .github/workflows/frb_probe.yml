name: FRB Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/frb_probe.yml
      - tool/scaffold_platforms.sh
      - flutter_rust_bridge.yaml
      - rust/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate FRB + platform scaffolds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust

      - name: Install dependencies
        run: flutter pub get

      - name: Install flutter_rust_bridge_codegen 2.8.0
        run: cargo install flutter_rust_bridge_codegen --version 2.8.0 --locked

      - name: Generate platform scaffolds and FRB bindings
        run: bash tool/scaffold_platforms.sh

      - name: Capture generated diff
        shell: bash
        run: |
          git status --short | tee frb-generated-status.txt
          git add -N .
          git diff --binary > frb-generated.patch

      - name: Upload generated output
        uses: actions/upload-artifact@v4
        with:
          name: frb-generated
          if-no-files-found: error
          path: |
            frb-generated-status.txt
            frb-generated.patch
            analysis_options.yaml
            pubspec.yaml
            lib/src/rust
            rust/src/frb_generated.rs
            rust_builder
            android
            ios
            macos
            linux
            windows
            cargokit_options.yaml
