name: Read-path Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/read_path_benchmark.yml'
      - 'Makefile'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'flutter_rust_bridge.yaml'
      - 'lib/**'
      - 'rust/**'
      - 'test/read_path_benchmark_test.dart'
      - 'test/read_path_boundary_benchmark_test.dart'
      - 'test/read_boundary_matrix_benchmark_test.dart'
      - 'test/multi_frontend_benchmark_test.dart'
      - 'tool/multi_frontend_benchmark.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-path-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Read-path + 0.8 multi-frontend / Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Install dependencies
        run: flutter pub get
      - name: Run decomposed read-path diagnostics
        env:
          READ_PATH_RUST_ITERATIONS: '1000'
          READ_PATH_DART_ITERATIONS: '500'
          READ_PATH_SAMPLES: '5'
        run: make benchmark-read-path
      - name: Run cross-runtime boundary diagnostic
        env:
          DXTR_BOX_READ_PATH_BOUNDARY_BENCHMARK: '1'
          DXTR_BOX_READ_PATH_DART_ITERATIONS: '500'
          DXTR_BOX_READ_PATH_DART_SAMPLES: '5'
          DXTR_BOX_READ_PATH_BOUNDARY_OUTPUT: 'build/read-path/dart-boundary.jsonl'
        run: |
          LD_LIBRARY_PATH="rust/target/release:${LD_LIBRARY_PATH:-}" \
          DYLD_LIBRARY_PATH="rust/target/release:${DYLD_LIBRARY_PATH:-}" \
          PATH="rust/target/release:$PATH" \
          flutter test test/read_path_boundary_benchmark_test.dart --reporter expanded
      - name: Run read boundary matrix
        env:
          DXTR_BOX_READ_BOUNDARY_MATRIX_BENCHMARK: '1'
          DXTR_BOX_READ_BOUNDARY_MATRIX_ITERATIONS: '250'
          DXTR_BOX_READ_BOUNDARY_MATRIX_SAMPLES: '5'
          DXTR_BOX_READ_BOUNDARY_MATRIX_OUTPUT: '${{ github.workspace }}/build/read-path/dart-boundary-matrix.jsonl'
          DXTR_BOX_READ_BOUNDARY_MATRIX_RUST_ITERATIONS: '250'
          DXTR_BOX_READ_BOUNDARY_MATRIX_RUST_SAMPLES: '5'
          DXTR_BOX_READ_BOUNDARY_MATRIX_RUST_OUTPUT: '${{ github.workspace }}/build/read-path/rust-boundary-matrix.jsonl'
        run: |
          cargo test --manifest-path rust/Cargo.toml --release \
            read_boundary_matrix_bench::read_boundary_matrix_microbench -- --ignored --nocapture
          LD_LIBRARY_PATH="rust/target/release:${LD_LIBRARY_PATH:-}" \
          DYLD_LIBRARY_PATH="rust/target/release:${DYLD_LIBRARY_PATH:-}" \
          PATH="rust/target/release:$PATH" \
          flutter test test/read_boundary_matrix_benchmark_test.dart --reporter expanded
      - name: Run 0.8 multi-frontend diagnostic
        env:
          DXTR_BOX_MULTI_FRONTEND_RUST_ITERATIONS: '200'
          DXTR_BOX_MULTI_FRONTEND_DART_ITERATIONS: '200'
          DXTR_BOX_MULTI_FRONTEND_SAMPLES: '5'
          DXTR_BOX_MULTI_FRONTEND_RECORDS: '1000'
        run: bash tool/multi_frontend_benchmark.sh
      - name: Verify benchmark evidence
        run: |
          test -s build/read-path/rust-read-path.jsonl
          test -s build/read-path/dart-read-path.jsonl
          test -s build/read-path/dart-boundary.jsonl
          test -s build/read-path/rust-boundary-matrix.jsonl
          test -s build/read-path/dart-boundary-matrix.jsonl
          test -s build/multi-frontend/rust-native.jsonl
          test -s build/multi-frontend/dart-frb.jsonl
      - name: Toolchain metadata
        if: always()
        run: |
          mkdir -p build/read-path build/multi-frontend
          flutter --version | tee build/read-path/flutter-version.txt
          rustc --version | tee build/read-path/rust-version.txt
          cargo --version | tee build/read-path/cargo-version.txt
          uname -a | tee build/read-path/runner.txt
          lscpu > build/read-path/cpu.txt || true
          cp build/read-path/flutter-version.txt build/multi-frontend/flutter-version.txt
          cp build/read-path/rust-version.txt build/multi-frontend/rust-version.txt
          cp build/read-path/cargo-version.txt build/multi-frontend/cargo-version.txt
          cp build/read-path/runner.txt build/multi-frontend/runner.txt
          cp build/read-path/cpu.txt build/multi-frontend/cpu.txt || true
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-path-and-multi-frontend-linux-x64
          path: |
            build/read-path
            build/multi-frontend
          if-no-files-found: error
          retention-days: 14
