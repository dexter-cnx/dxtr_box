name: Read-path Benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: read-path-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: 0.5 read-path decomposition / Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Install dependencies
        run: flutter pub get
      - name: Generate PR2 sync point-read candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('rust/src/api.rs')
          text = path.read_text()
          replacements = {
              'pub fn get(box_name: String, key: String) -> Result<Option<Vec<u8>>, String> {':
                  '#[frb(sync)]\npub fn get(box_name: String, key: String) -> Result<Option<Vec<u8>>, String> {',
              'pub fn contains_key(box_name: String, key: String) -> Result<bool, String> {':
                  '#[frb(sync)]\npub fn contains_key(box_name: String, key: String) -> Result<bool, String> {',
          }
          for old, new in replacements.items():
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'expected declaration not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          dart pub global activate flutter_rust_bridge_codegen 2.8.0
          export PATH="$PATH:$HOME/.pub-cache/bin"
          make frb-generate
      - name: Run decomposed read-path diagnostics
        env:
          READ_PATH_RUST_ITERATIONS: '1000'
          READ_PATH_DART_ITERATIONS: '500'
          READ_PATH_SAMPLES: '5'
        run: make benchmark-read-path
      - name: Run PR2 cross-runtime boundary diagnostic
        env:
          DXTR_BOX_READ_PATH_BOUNDARY_BENCHMARK: '1'
          DXTR_BOX_READ_PATH_DART_ITERATIONS: '500'
          DXTR_BOX_READ_PATH_DART_SAMPLES: '5'
          DXTR_BOX_READ_PATH_BOUNDARY_OUTPUT: 'build/read-path/dart-boundary.jsonl'
        run: |
          LD_LIBRARY_PATH="rust/target/release:${LD_LIBRARY_PATH:-}" \
          DYLD_LIBRARY_PATH="rust/target/release:${DYLD_LIBRARY_PATH:-}" \
          PATH="rust/target/release:$PATH" \
          flutter test test/read_path_boundary_benchmark_test.dart --reporter expanded
      - name: Verify read-path evidence
        run: |
          test -s build/read-path/rust-read-path.jsonl
          test -s build/read-path/dart-read-path.jsonl
          test -s build/read-path/dart-boundary.jsonl
      - name: Capture generated sync candidate
        if: always()
        run: |
          mkdir -p build/read-path/sync-candidate
          git diff -- rust/src/api.rs lib/src/rust rust/src/frb_generated.rs > build/read-path/sync-candidate.patch || true
          git diff --name-only -- rust/src/api.rs lib/src/rust rust/src/frb_generated.rs > build/read-path/sync-candidate-files.txt || true
      - name: Toolchain metadata
        if: always()
        run: |
          mkdir -p build/read-path
          flutter --version | tee build/read-path/flutter-version.txt
          rustc --version | tee build/read-path/rust-version.txt
          cargo --version | tee build/read-path/cargo-version.txt
          uname -a | tee build/read-path/runner.txt
          lscpu > build/read-path/cpu.txt || true
      - name: Commit generated sync candidate
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/src/api.rs lib/src/rust rust/src/frb_generated.rs
          if git diff --cached --quiet; then
            echo 'Generated bindings are already current.'
            exit 0
          fi
          git commit -m 'perf: use sync FRB boundary for point reads'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload read-path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-path-benchmark-linux-x64
          path: build/read-path
          if-no-files-found: error
          retention-days: 14
