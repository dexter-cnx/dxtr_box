name: Read-path Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/read_path_benchmark.yml'
      - 'Makefile'
      - 'lib/**'
      - 'rust/**'
      - 'test/**'
      - 'tool/pr3_apply.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: read-path-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: 0.5 PR3 implementation + batch evidence / Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Install dependencies
        run: flutter pub get
      - name: Apply PR3 source patch
        run: python3 tool/pr3_apply.py
      - name: Generate pinned FRB bindings
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.8.0 --locked
          make frb-generate
      - name: Format and validate PR3
        run: |
          make format
          make ci-fast
          make native-test
          make benchmark-batch-read
      - name: Commit generated PR3 implementation
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile lib/src/box.dart lib/src/native_api.dart lib/src/rust rust/src/api.rs rust/src/db.rs rust/src/frb_generated.rs test/box_test.dart test/native_integration_test.dart test/batch_read_benchmark_test.dart
          if git diff --cached --quiet; then
            echo 'PR3 implementation already current.'
            exit 0
          fi
          git commit -m 'perf: add one-snapshot batch reads'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
