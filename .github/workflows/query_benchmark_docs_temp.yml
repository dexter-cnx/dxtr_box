name: Temporary Query Benchmark Docs Finalize

on:
  push:
    branches:
      - feature/0.3-query-benchmarks

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/0.3-query-benchmarks
          fetch-depth: 0
      - name: Sync benchmark docs
        run: python3 tool/apply_query_benchmark_docs.py
      - name: Validate docs and temp state
        run: |
          grep -q 'Query/index diagnostic benchmark' README.md
          grep -q 'Query/index diagnostic benchmark' docs/CODE_WALKTHROUGH.md
          grep -q 'Query/index benchmark gate' docs/QUERY_INDEX_03.md
          grep -q 'Query/index benchmark evidence' docs/PROJECT_HANDOFF.md
          test -s docs/QUERY_BENCHMARK_03.md
      - name: Remove temporary docs tooling
        run: rm tool/apply_query_benchmark_docs.py .github/workflows/query_benchmark_docs_temp.yml
      - name: Commit docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record query index benchmark evidence'
          git push origin HEAD:feature/0.3-query-benchmarks
