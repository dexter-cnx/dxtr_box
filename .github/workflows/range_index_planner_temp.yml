name: Temporary Range Index Planner Finalize

on:
  push:
    branches:
      - feature/0.3-range-index-planner

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/0.3-range-index-planner
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply range planner patch
        run: python3 tool/apply_range_index_planner.py

      - name: Format Rust
        run: cargo fmt --manifest-path rust/Cargo.toml

      - name: Validate Rust profiles
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features
          cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features --features encryption
          cargo test --manifest-path rust/Cargo.toml --all-targets

      - name: Remove temporary tooling
        run: git rm .github/workflows/range_index_planner_temp.yml tool/apply_range_index_planner.py

      - name: Commit finalized range planner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/src/query.rs rust/src/index.rs rust/tests/query_index.rs
          if git diff --cached --quiet; then
            echo "No range planner changes to commit"
            exit 1
          fi
          git commit -m "feat: expand persisted index planner ranges"
          git push origin HEAD:feature/0.3-range-index-planner
