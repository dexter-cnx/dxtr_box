name: Encryption Review Fix 3

on:
  push:
    branches: [feature/persisted-encryption]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/persisted-encryption

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: false

      - name: Apply and validate patch
        run: |
          python3 tool/patch_encryption_review.py
          cargo fmt --manifest-path rust/Cargo.toml
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --all-targets

      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/src/db.rs rust/src/crypto.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden encrypted box authentication and creation"
          git push origin HEAD:feature/persisted-encryption
