name: Temporary Query Index Benchmark

on:
  push:
    branches:
      - feature/0.3-query-benchmarks

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/0.3-query-benchmarks
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - name: Format benchmark source
        run: dart format benchmark/test/query_index_benchmark_test.dart
      - name: Run query/index benchmark matrix
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/rust/target/release
        run: |
          set -o pipefail
          make benchmark-query-index 2>&1 | tee /tmp/query-benchmark.log
          grep '^DXTR_BOX_QUERY_BENCHMARK ' /tmp/query-benchmark.log | sed 's/^DXTR_BOX_QUERY_BENCHMARK //' > /tmp/query-benchmark.jsonl
          test -s /tmp/query-benchmark.jsonl
      - name: Upload benchmark diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: query-index-benchmark
          path: /tmp/query-benchmark.jsonl
      - name: Remove temporary workflow
        run: rm .github/workflows/query_benchmark_temp.yml
      - name: Commit finalized benchmark harness
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'bench: finalize query index benchmark matrix'
          git push origin HEAD:feature/0.3-query-benchmarks
