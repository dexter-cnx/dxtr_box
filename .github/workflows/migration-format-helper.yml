name: Migration Format Helper

on:
  push:
    branches: [feature/plaintext-encryption-migration]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --manifest-path rust/Cargo.toml
      - name: Upload formatted database source
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-db
          path: rust/src/db.rs
          if-no-files-found: error
