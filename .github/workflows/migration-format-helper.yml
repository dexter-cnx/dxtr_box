name: Migration Format Helper

on:
  push:
    branches:
      - feature/plaintext-encryption-migration

permissions:
  contents: write

jobs:
  format-and-regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/plaintext-encryption-migration
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Install dependencies
        run: flutter pub get

      - name: Install flutter_rust_bridge_codegen 2.8.0
        run: cargo install flutter_rust_bridge_codegen --version 2.8.0 --locked

      - name: Format Rust and regenerate FRB bindings
        run: |
          cargo fmt --manifest-path rust/Cargo.toml
          flutter_rust_bridge_codegen generate

      - name: Remove one-shot helper
        run: git rm .github/workflows/migration-format-helper.yml

      - name: Commit generated outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust/src lib/src/rust
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: format migration and regenerate FRB bindings"
          git push origin HEAD:feature/plaintext-encryption-migration
