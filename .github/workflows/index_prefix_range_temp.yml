name: Temporary Index Prefix Range Finalize

on:
  push:
    branches:
      - feature/0.3-index-prefix-range

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/0.3-index-prefix-range
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: false

      - name: Apply index prefix range optimization
        run: python3 tool/apply_index_prefix_range.py

      - name: Format Rust
        run: cargo fmt --manifest-path rust/Cargo.toml

      - name: Validate Rust profiles
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features
          cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features --features encryption
          cargo test --manifest-path rust/Cargo.toml --all-targets

      - name: Remove temporary tooling
        run: git rm .github/workflows/index_prefix_range_temp.yml tool/apply_index_prefix_range.py

      - name: Commit finalized optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/src/index.rs
          if git diff --cached --quiet; then
            echo "No index prefix range changes to commit"
            exit 1
          fi
          git commit -m "perf: bound persisted index scans by name prefix"
          git push origin HEAD:feature/0.3-index-prefix-range
