name: DeleteAll Compact Sync

on:
  push:
    branches: [feature/delete-all-compact]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/delete-all-compact

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: false

      - name: Install FRB codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.8.0 --locked

      - name: Apply source changes and refresh bindings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tool/apply_delete_all_compact.py')
          text = path.read_text()
          text = text.replace('final box = boxes[boxName];', 'final box = _boxes[boxName];')
          text = text.replace('        emit(NativeWatchEvent(', '        _emit(NativeWatchEvent(')
          text = text.replace('if (!boxes.containsKey(boxName))', 'if (!_boxes.containsKey(boxName))')
          text = text.replace(
              'test_marker = "    test(\'clear removes all values\', () async {"',
              'test_marker = "  test(\'close is idempotent and rejects later operations\', () async {"',
          )
          path.write_text(text)
          PY

          python3 tool/apply_delete_all_compact.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/box_test.dart')
          text = path.read_text()
          text = text.replace(
              '  Future<void> clear(String boxName) async {',
              '  @override\n  Future<void> clear(String boxName) async {',
              1,
          )
          text = text.replace(
              '  Future<List<String>> getAllKeys(String boxName) async {',
              '  @override\n  Future<List<String>> getAllKeys(String boxName) async {',
              1,
          )
          path.write_text(text)

          path = Path('test/watch_hydration_test.dart')
          text = path.read_text()
          marker = '  @override\n  Future<void> clear(String boxName) async {'
          insert = '''  @override
          Future<List<String>> deleteAll(String boxName, List<String> keys) async {
            _requireOpen(boxName);
            final deleted = <String>[];
            for (final key in keys) {
              if (_box(boxName).remove(key) != null) {
                deleted.add(key);
                _emit(
                  NativeWatchEvent(
                    boxName: boxName,
                    type: NativeWatchEventType.delete,
                    key: key,
                  ),
                );
              }
            }
            return deleted;
          }

          '''
          if marker not in text:
              raise SystemExit('hydration clear marker not found')
          text = text.replace(marker, insert + marker, 1)
          marker = '  @override\n  Future<List<String>> getAllKeys(String boxName) async {'
          insert = '''  @override
          Future<bool> compact(String boxName) async {
            _requireOpen(boxName);
            return false;
          }

          '''
          if marker not in text:
              raise SystemExit('hydration getAllKeys marker not found')
          text = text.replace(marker, insert + marker, 1)
          path.write_text(text)
          PY

          cargo fmt --manifest-path rust/Cargo.toml
          flutter pub get
          flutter_rust_bridge_codegen generate
          dart format lib test

          cat > Makefile <<'EOF'
          .PHONY: help pub-get format format-check analyze test rust-fmt rust-clippy rust-test rust-check frb-generate native-build native-test preflight example-android example-linux example-windows example-macos example-ios

          FLUTTER ?= flutter
          CARGO ?= cargo
          FRB ?= flutter_rust_bridge_codegen

          help:
          	@echo "dxtr_box developer targets"
          	@echo "  make preflight      Format check + analyze + Dart/Rust tests"
          	@echo "  make frb-generate   Refresh flutter_rust_bridge bindings"
          	@echo "  make native-test    Native FRB round-trip test"
          	@echo "  make rust-check     rustfmt + clippy + Rust tests"

          pub-get:
          	$(FLUTTER) pub get

          format:
          	dart format lib test
          	$(CARGO) fmt --manifest-path rust/Cargo.toml

          format-check:
          	dart format --output=none --set-exit-if-changed lib test
          	$(CARGO) fmt --manifest-path rust/Cargo.toml -- --check

          analyze: pub-get
          	$(FLUTTER) analyze

          test: pub-get
          	$(FLUTTER) test

          rust-fmt:
          	$(CARGO) fmt --manifest-path rust/Cargo.toml -- --check

          rust-clippy:
          	$(CARGO) clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

          rust-test:
          	$(CARGO) test --manifest-path rust/Cargo.toml --all-targets

          rust-check: rust-fmt rust-clippy rust-test

          frb-generate: pub-get
          	$(FRB) generate
          	dart format lib/src/rust

          native-build:
          	$(CARGO) build --manifest-path rust/Cargo.toml --release

          native-test: pub-get native-build
          	DXTR_BOX_NATIVE_TEST=1 $(FLUTTER) test test/native_integration_test.dart --reporter expanded

          preflight: format-check analyze test rust-check

          example-android:
          	cd example && $(FLUTTER) pub get && $(FLUTTER) build apk --debug

          example-linux:
          	cd example && $(FLUTTER) pub get && $(FLUTTER) build linux --debug

          example-windows:
          	cd example && $(FLUTTER) pub get && $(FLUTTER) build windows --debug

          example-macos:
          	cd example && $(FLUTTER) pub get && $(FLUTTER) build macos --debug

          example-ios:
          	cd example && $(FLUTTER) pub get && $(FLUTTER) build ios --debug --no-codesign
          EOF

          make preflight

      - name: Commit milestone
        run: |
          rm -f .github/workflows/delete_all_compact_sync.yml tool/apply_delete_all_compact.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add deleteAll compact and developer Makefile"
          git push origin HEAD:feature/delete-all-compact
