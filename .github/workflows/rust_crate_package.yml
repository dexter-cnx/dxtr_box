name: Rust Crate Package Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'rust/Cargo.toml'
      - 'rust/README.md'
      - 'rust/src/**'
      - '.github/workflows/rust_crate_package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: cargo package / crates.io payload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Validate crates.io package archive
        run: cargo package --manifest-path rust/Cargo.toml
