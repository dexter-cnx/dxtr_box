name: Rust Crate Package Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
      - 'pubspec.yaml'
      - 'LICENSE'
      - '.github/workflows/rust_crate_package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: cargo package / crates.io payload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - name: Verify package identity and version alignment
        shell: bash
        run: |
          set -euo pipefail
          dart_version="$(sed -nE "s/^version:[[:space:]]*['\"]?([^'\"[:space:]]+)['\"]?[[:space:]]*$/\1/p" pubspec.yaml | head -n 1)"
          rust_version="$(awk -F'\"' '/^version = "/ { print $2; exit }' rust/Cargo.toml)"
          crate_name="$(awk -F'\"' '/^name = "/ { print $2; exit }' rust/Cargo.toml)"

          test "$crate_name" = "rust_lib_dxtr_box"
          test -n "$dart_version"
          test -n "$rust_version"
          test "$dart_version" = "$rust_version"
          test -f LICENSE

          echo "Rust crate publication metadata aligned: $crate_name $rust_version"
      - name: Validate crates.io package archive
        run: cargo package --manifest-path rust/Cargo.toml
