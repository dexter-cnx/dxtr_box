name: Read Boundary Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/read_boundary_matrix.yml'
      - 'docs/READ_BOUNDARY_MATRIX.md'
      - 'lib/**'
      - 'rust/**'
      - 'test/read_boundary_matrix_benchmark_test.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-boundary-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Rust → FRB → adapter → public Dart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: rust
      - run: flutter pub get
      - name: Format checks
        run: |
          dart format --output=none --set-exit-if-changed test/read_boundary_matrix_benchmark_test.dart
          cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Build native library
        run: cargo build --manifest-path rust/Cargo.toml --release
      - name: Rust core matrix
        env:
          DXTR_BOX_READ_BOUNDARY_MATRIX_RUST_ITERATIONS: '250'
          DXTR_BOX_READ_BOUNDARY_MATRIX_RUST_SAMPLES: '5'
          DXTR_BOX_READ_BOUNDARY_MATRIX_RUST_OUTPUT: 'build/read-boundary-matrix/rust.jsonl'
        run: |
          cargo test --manifest-path rust/Cargo.toml --release \
            read_boundary_matrix_bench::read_boundary_matrix_microbench -- --ignored --nocapture
      - name: Dart boundary matrix
        env:
          DXTR_BOX_READ_BOUNDARY_MATRIX_BENCHMARK: '1'
          DXTR_BOX_READ_BOUNDARY_MATRIX_ITERATIONS: '250'
          DXTR_BOX_READ_BOUNDARY_MATRIX_SAMPLES: '5'
          DXTR_BOX_READ_BOUNDARY_MATRIX_OUTPUT: 'build/read-boundary-matrix/dart.jsonl'
        run: |
          LD_LIBRARY_PATH="rust/target/release:${LD_LIBRARY_PATH:-}" \
          DYLD_LIBRARY_PATH="rust/target/release:${DYLD_LIBRARY_PATH:-}" \
          PATH="rust/target/release:$PATH" \
          flutter test test/read_boundary_matrix_benchmark_test.dart --reporter expanded
      - name: Verify evidence
        run: |
          test -s build/read-boundary-matrix/rust.jsonl
          test -s build/read-boundary-matrix/dart.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-boundary-matrix-linux-x64
          path: build/read-boundary-matrix
          if-no-files-found: warn
          retention-days: 14
