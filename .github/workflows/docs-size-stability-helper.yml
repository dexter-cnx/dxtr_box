name: Docs Size Stability Helper

on:
  push:
    branches: [feature/native-size-stability]
    paths:
      - .github/workflows/docs-size-stability-helper.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/native-size-stability
      - name: Sync validated size stability docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/PROJECT_HANDOFF.md')
          s = p.read_text()
          s = s.replace(
              'Implemented on `main` through PR #11, with PR #12 validating Cargo feature profiles and the first reproducible Linux x86_64 native-size baseline:',
              'Implemented on `main` through PR #12, with PR #13 validating same-commit native-size reproducibility before any cross-commit regression budget is introduced:'
          )
          s = s.replace(
              '- Linux x86_64 release-library baseline: minimal 1,893,736 bytes; encryption 1,992,296 bytes; full 2,032,312 bytes.\n',
              '- Linux x86_64 release-library baseline: minimal 1,893,736 bytes; encryption 1,992,296 bytes; full 2,032,312 bytes.\n- PR #13 CI #151 repeated each profile three times on the same commit/toolchain and measured zero-byte spread for all profiles.\n'
          )
          s = s.replace('make native-size-baseline\n', 'make native-size-baseline\nmake native-size-stability\n')
          s = s.replace(
              'Generated FRB bindings stay checked in whenever native APIs change. `make native-size-baseline` is the canonical local entry point for the same minimal/encryption/full release-size measurement contract used by CI.',
              'Generated FRB bindings stay checked in whenever native APIs change. `make native-size-baseline` records one minimal/encryption/full release-size baseline; `make native-size-stability` repeats those measurements to validate same-commit reproducibility before any regression budget is considered.'
          )
          s = s.replace(
              'Native size / Linux x86_64\n  isolated minimal release build\n  isolated encryption release build\n  isolated full release build\n  retain native-size-baseline.tsv only',
              'Native size / Linux x86_64\n  isolated minimal release build\n  isolated encryption release build\n  isolated full release build\n  repeat each profile three times on the same commit/toolchain\n  require zero-byte same-commit spread\n  retain native-size-baseline.tsv + native-size-stability.tsv only'
          )
          s = s.replace(
              'The size job retains only `native-size-baseline.tsv`. No regression threshold is enabled yet because repeated controlled measurements are required before a size gate is defensible.',
              'The size job retains only the machine-readable baseline and stability TSV files. PR #13 CI #151 proved zero-byte spread across three repeated builds of each profile on Linux x86_64 with rustc/cargo 1.97.1. No cross-commit regression threshold is enabled yet; same-commit reproducibility is now a CI prerequisite rather than a size budget.'
          )
          old = '''## Next implementation sequence\n\n1. Merge PR #12 after final documentation CI remains green.\n2. Collect repeated size measurements and only then define a binary-size regression policy.\n3. Begin 0.3 query/index work while preserving the validated profile contract.\n4. Keep Dart 3.13 recorded-use/native tree shaking deferred.\n5. Before 1.0 RC, execute the full Hive Functional Parity Audit against the then-current Hive CE release and close every practical `Gap`.'''
          new = '''## PR #13 validated — native size measurement stability\n\nCI #151 repeated release-library measurement three times per profile on the same Linux x86_64 commit/toolchain:\n\n| Profile | Runs | Min bytes | Max bytes | Spread |\n| --- | ---: | ---: | ---: | ---: |\n| minimal | 3 | 1,893,736 | 1,893,736 | 0 |\n| encryption | 3 | 1,992,296 | 1,992,296 | 0 |\n| full | 3 | 2,032,312 | 2,032,312 | 0 |\n\nThis validates the measurement harness, not a cross-commit size budget. A later regression policy must compare controlled baselines deliberately and account for toolchain/platform changes.\n\n## Next implementation sequence\n\n1. Merge PR #13 after final documentation CI remains green.\n2. Begin 0.3 query/index work while preserving the validated minimal/encryption/full profile contract.\n3. Design cross-commit binary-size regression policy separately; do not block query/index work on it.\n4. Keep Dart 3.13 recorded-use/native tree shaking deferred.\n5. Before 1.0 RC, execute the full Hive Functional Parity Audit against the then-current Hive CE release and close every practical `Gap`.'''
          s = s.replace(old, new)
          s = s.replace(
              'Repeated controlled size measurements + regression policy\n  -> next size-hardening step',
              'Same-commit repeated size measurement stability\n  -> validated in PR #13\n\nCross-commit regression budget\n  -> future size-hardening policy; not enabled yet'
          )
          p.write_text(s)

          p = Path('docs/CODE_WALKTHROUGH.md')
          s = p.read_text()
          s = s.replace('make native-size-baseline\n', 'make native-size-baseline\nmake native-size-stability\n')
          s = s.replace(
              'CI also runs generated-FRB drift detection, Rust fmt/clippy plus minimal/encryption/full profile tests on Ubuntu/macOS/Windows, the minimum Flutter 3.22/Dart 3.4 lane, a Linux x86_64 native-size baseline job, and the five-platform Flutter example build matrix.',
              'CI also runs generated-FRB drift detection, Rust fmt/clippy plus minimal/encryption/full profile tests on Ubuntu/macOS/Windows, the minimum Flutter 3.22/Dart 3.4 lane, and a Linux x86_64 native-size job that records a baseline and repeats each profile three times to verify same-commit reproducibility.'
          )
          s = s.replace(
              'The validated Linux x86_64 release-library baseline is 1,893,736 bytes for minimal, 1,992,296 bytes for encryption, and 2,032,312 bytes for full. These measurements are informational and platform-specific.',
              'The validated Linux x86_64 release-library baseline is 1,893,736 bytes for minimal, 1,992,296 bytes for encryption, and 2,032,312 bytes for full. PR #13 CI #151 repeated each profile three times with zero-byte spread, proving the harness is deterministic on that commit/toolchain. These measurements remain informational and platform-specific.'
          )
          s = s.replace(
              '1. collect repeated size measurements before introducing a regression threshold;\n2. begin 0.3 query/index work while preserving the three-profile contract;\n3. add binary-size regression CI only when the baseline is stable enough to be meaningful;',
              '1. begin 0.3 query/index work while preserving the three-profile contract;\n2. design any cross-commit binary-size regression budget separately from the now-validated same-commit stability gate;\n3. keep the size artifacts machine-readable so future policy can compare controlled baselines;'
          )
          p.write_text(s)

          p = Path('docs/TESTING.md')
          s = p.read_text()
          s = s.replace('make benchmark-smoke\n', 'make benchmark-smoke\nmake native-size-stability\n')
          s = s.replace(
              'Each host runs:\n\n- rustfmt check\n- clippy with warnings denied\n- default-feature tests\n- encryption-feature tests',
              'Each host runs:\n\n- rustfmt check\n- clippy with warnings denied\n- minimal-profile tests\n- encryption-profile tests\n- full/default-profile tests'
          )
          insert = '''\n### Native size stability job — Linux x86_64\n\nThe size job first records the normal minimal/encryption/full release-library baseline, then runs `tool/native_size_stability.sh` with three isolated builds per profile. The job fails if `min_bytes != max_bytes` for any profile on the same commit/toolchain.\n\nCI #151 validated:\n\n- minimal: 3 runs, 1,893,736 bytes each, spread 0;\n- encryption: 3 runs, 1,992,296 bytes each, spread 0;\n- full: 3 runs, 2,032,312 bytes each, spread 0.\n\nThis is a reproducibility gate, not a cross-commit binary-size budget. The artifact retains only `native-size-baseline.tsv` and `native-size-stability.tsv`.\n'''
          s = s.replace('\n## Platform build validation\n', insert + '\n## Platform build validation\n')
          s = s.replace(
              '- release binary-size regression measurement',
              '- cross-commit binary-size regression budget/threshold'
          )
          p.write_text(s)
          PY
      - name: Remove one-shot helper
        run: rm .github/workflows/docs-size-stability-helper.yml
      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_HANDOFF.md docs/CODE_WALKTHROUGH.md docs/TESTING.md .github/workflows/docs-size-stability-helper.yml
          git commit -m "docs: record native size stability validation"
          git push origin HEAD:feature/native-size-stability
