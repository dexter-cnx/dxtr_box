name: Temporary Prefix Range Docs Finalize

on:
  push:
    branches:
      - feature/0.3-index-prefix-range

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/0.3-index-prefix-range
          fetch-depth: 0

      - name: Update docs
        run: python3 tool/update_prefix_range_docs.py

      - name: Remove temporary tooling
        run: git rm .github/workflows/prefix_range_docs_temp.yml tool/update_prefix_range_docs.py

      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/CODE_WALKTHROUGH.md docs/PROJECT_HANDOFF.md docs/QUERY_INDEX_03.md
          git commit -m "docs: document bounded persisted-index lookup"
          git push origin HEAD:feature/0.3-index-prefix-range
