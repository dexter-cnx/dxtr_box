name: Normalize FRB Loader

on:
  push:
    branches: [feature/example-platform-builds]
    paths:
      - .github/workflows/normalize_frb_loader.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/example-platform-builds
          fetch-depth: 0

      - name: Align generated loader stem
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/src/rust/frb_generated.dart')
          text = path.read_text()
          old = "stem: 'dxtr_box_rust',"
          new = "stem: 'rust_lib_dxtr_box',"
          if old not in text:
              raise SystemExit('expected FRB loader stem not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/normalize_frb_loader.yml

      - name: Commit normalized loader
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/rust/frb_generated.dart .github/workflows/normalize_frb_loader.yml
          git commit -m "fix: align FRB loader with Cargokit library name"
          git push origin feature/example-platform-builds
