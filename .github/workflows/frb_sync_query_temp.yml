name: Temporary Query Index Finalize

on:
  push:
    branches:
      - feature/0.3-query-index-foundation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/0.3-query-index-foundation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true
          cache-workspaces: rust
      - run: flutter pub get
      - run: python3 tool/apply_query_index_db_patch.py
      - run: python3 tool/fix_query_index_api.py
      - run: python3 tool/fix_query_index_cfg.py
      - run: cargo fmt --manifest-path rust/Cargo.toml
      - name: Validate Rust profiles
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features
          cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features --features encryption
          cargo test --manifest-path rust/Cargo.toml --all-targets
      - run: cargo install flutter_rust_bridge_codegen --version 2.8.0 --locked
      - name: Regenerate bindings
        run: |
          flutter_rust_bridge_codegen generate
          dart format lib/src/rust lib/src/box.dart lib/src/native_api.dart
      - name: Validate Flutter
        run: |
          flutter analyze
          flutter test --reporter expanded
      - name: Remove temporary tooling
        run: git rm .github/workflows/frb_sync_query_temp.yml tool/apply_query_index_db_patch.py tool/fix_query_index_api.py tool/fix_query_index_cfg.py
      - name: Commit finalized implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/src/db.rs rust/src/api.rs rust/src/index.rs rust/src/query.rs rust/src/lib.rs rust/Cargo.toml rust/tests/query_index.rs lib/src/rust lib/src/box.dart lib/src/native_api.dart
          git add -u .github/workflows tool
          git commit -m 'feat: add native query scan and persisted indexes'
          git push origin HEAD:feature/0.3-query-index-foundation
