name: Temporary Query Index Finalize

on:
  push:
    branches:
      - feature/0.3-query-index-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'dexter-cnx/dxtr_box'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/0.3-query-index-foundation
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true
          cache-workspaces: rust

      - name: Install dependencies
        run: flutter pub get

      - name: Normalize temporary patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tool/apply_query_index_db_patch.py')
          text = path.read_text()
          old = '        return index::list(&db).map(|definitions| {'
          new = '        index::list(&db).map(|definitions| {'
          if old not in text:
              raise SystemExit('expected list_indexes return pattern not found')
          text = text.replace(old, new, 1)
          old_tail = '''        });\n    }\n\n    #[cfg(not(feature = "full"))]'''
          new_tail = '''        })\n    }\n\n    #[cfg(not(feature = "full"))]'''
          if old_tail not in text:
              raise SystemExit('expected list_indexes map tail not found')
          path.write_text(text.replace(old_tail, new_tail, 1))
          PY

      - name: Apply transactional index integration
        run: python3 tool/apply_query_index_db_patch.py

      - name: Format native sources
        run: cargo fmt --manifest-path rust/Cargo.toml

      - name: Validate Rust profiles
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features
          cargo test --manifest-path rust/Cargo.toml --all-targets --no-default-features --features encryption
          cargo test --manifest-path rust/Cargo.toml --all-targets

      - name: Install flutter_rust_bridge_codegen 2.8.0
        run: cargo install flutter_rust_bridge_codegen --version 2.8.0 --locked

      - name: Regenerate exact bindings
        run: |
          flutter_rust_bridge_codegen generate
          dart format lib/src/rust lib/src/box.dart lib/src/native_api.dart

      - name: Validate Flutter facade
        run: |
          flutter analyze
          flutter test --reporter expanded

      - name: Remove temporary finalize tooling
        run: git rm .github/workflows/frb_sync_query_temp.yml tool/apply_query_index_db_patch.py

      - name: Commit finalized query/index implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/src/db.rs rust/src/api.rs rust/src/index.rs rust/src/query.rs rust/src/lib.rs rust/Cargo.toml lib/src/rust lib/src/box.dart lib/src/native_api.dart
          git add -u .github/workflows tool
          git commit -m 'feat: add native query scan and persisted indexes'
          git push origin HEAD:feature/0.3-query-index-foundation
