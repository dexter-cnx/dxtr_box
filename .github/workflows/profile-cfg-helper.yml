name: Profile CFG Helper

on:
  push:
    branches: [feature/cargo-feature-size-baseline]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/cargo-feature-size-baseline
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply profile cfg cleanup
        shell: python
        run: |
          from pathlib import Path

          db = Path('rust/src/db.rs')
          text = db.read_text()
          text = text.replace(
              'fn encode_value(&self, record_key: &str, plaintext: &[u8])',
              'fn encode_value(&self, _record_key: &str, plaintext: &[u8])',
          ).replace(
              'crypto::encrypt_with_aad(key, record_key.as_bytes(), plaintext)',
              'crypto::encrypt_with_aad(key, _record_key.as_bytes(), plaintext)',
          ).replace(
              'fn decode_value(&self, record_key: &str, stored: &[u8])',
              'fn decode_value(&self, _record_key: &str, stored: &[u8])',
          ).replace(
              'crypto::decrypt_with_aad(key, record_key.as_bytes(), stored)',
              'crypto::decrypt_with_aad(key, _record_key.as_bytes(), stored)',
          )
          text = text.replace(
              'pub fn encrypt_box(name: &str, encryption_key: &str) -> Result<(), String> {',
              '#[cfg(all(feature = "encryption", feature = "maintenance"))]\npub fn encrypt_box(name: &str, encryption_key: &str) -> Result<(), String> {',
              1,
          )
          text = text.replace(
              'pub fn compact(name: &str) -> Result<bool, String> {',
              '#[cfg(feature = "maintenance")]\npub fn compact(name: &str) -> Result<bool, String> {',
              1,
          )
          text = text.replace(
              '#[cfg(feature = "encryption")]\n    #[test]\n    fn plaintext_box_migrates_to_encrypted_atomically()',
              '#[cfg(all(feature = "encryption", feature = "maintenance"))]\n    #[test]\n    fn plaintext_box_migrates_to_encrypted_atomically()',
          ).replace(
              '#[cfg(feature = "encryption")]\n    #[test]\n    fn migration_rejects_open_missing_already_encrypted_and_empty_key()',
              '#[cfg(all(feature = "encryption", feature = "maintenance"))]\n    #[test]\n    fn migration_rejects_open_missing_already_encrypted_and_empty_key()',
          ).replace(
              '#[cfg(feature = "encryption")]\n    #[test]\n    fn migration_validation_failure_preserves_plaintext_state()',
              '#[cfg(all(feature = "encryption", feature = "maintenance"))]\n    #[test]\n    fn migration_validation_failure_preserves_plaintext_state()',
          )
          text = text.replace(
              '    #[test]\n    fn compact_requires_a_single_idle_handle()',
              '    #[cfg(feature = "maintenance")]\n    #[test]\n    fn compact_requires_a_single_idle_handle()',
              1,
          )
          db.write_text(text)

          api = Path('rust/src/api.rs')
          text = api.read_text().replace(
              '        return db::encrypt_box(&name, &encryption_key);',
              '        db::encrypt_box(&name, &encryption_key)',
          ).replace(
              '        return db::compact(&box_name);',
              '        db::compact(&box_name)',
          )
          api.write_text(text)

      - name: Format Rust
        run: cargo fmt --manifest-path rust/Cargo.toml

      - name: Remove helper and commit
        run: |
          git rm .github/workflows/profile-cfg-helper.yml
          git add rust/src/api.rs rust/src/db.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: make native profiles warning-clean"
          git push origin HEAD:feature/cargo-feature-size-baseline
